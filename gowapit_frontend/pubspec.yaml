name: gowapit_frontend
description: "A new Flutter project."
publish_to: 'none'
version: 1.3.2+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  easy_localization: ^3.0.8
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  image_picker: ^1.1.2
  lottie: ^3.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/1.png
    - assets/images/2.png
    - assets/images/3.png
    - assets/images/4.png
    - assets/images/5.png
    - assets/images/6.png
    - assets/images/peta_wapit.png
    - assets/data_pariwisata.json
    - assets/data_berita.json
    - assets/translations/
    - assets/lottie/
    - assets/lottie/detail cuaca/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Logo.png" # <-- Pastikan jalur ini sama dengan letak logo Anda
  min_sdk_size: 21